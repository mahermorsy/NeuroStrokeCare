services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
      MSSQL_PID: Express
    volumes:
      - neurostroke_sql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: NeuroStrokeCare.api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__NeuroFlowDbContext: Server=db,1433;Database=${DB_NAME:-NeuroStrokeCareDB};User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True;MultipleActiveResultSets=true
      Jwt__Key: ${JWT_KEY:?set JWT_KEY in .env}
      Jwt__Issuer: ${JWT_ISSUER:-NeuroStrokeCare.api}
      Jwt__Audience: ${JWT_AUDIENCE:-NeuroStrokeCare.Client}
      Jwt__DurationInMinutes: ${JWT_DURATION_MINUTES:-60}
      SeedUsers__DefaultPassword: ${SEED_USERS_DEFAULT_PASSWORD:-}
      Email__SmtpHost: ${SMTP_HOST:-}
      Email__SmtpPort: ${SMTP_PORT:-587}
      Email__SmtpUsername: ${SMTP_USERNAME:-}
      Email__SmtpPassword: ${SMTP_PASSWORD:-}
      Email__EnableSsl: ${SMTP_ENABLE_SSL:-true}
      Email__FromAddress: ${SMTP_FROM_ADDRESS:-}
      Email__FromName: ${SMTP_FROM_NAME:-NeuroStrokeCare}
      Email__FrontendResetUrl: ${FRONTEND_RESET_URL:-}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"
    restart: unless-stopped

  client:
    build:
      context: ./NeuroStrokeCare.client
    depends_on:
      - api
    expose:
      - "80"
    restart: unless-stopped

volumes:
  neurostroke_sql:

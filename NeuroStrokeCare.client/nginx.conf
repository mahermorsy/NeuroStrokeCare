server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip the usual text-based assets.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Forward API calls to the backend container (see docker-compose.yml —
    # the "api" service name must match). Keeps the frontend calling a
    # relative '/api' path in both dev and production, so no build-time
    # API URL needs to be baked into the client bundle.
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Staff ID card photos — served by the API from its own uploads volume,
    # same relative-path trick as /api/ so the client never bakes in a host.
    location /uploads/ {
        proxy_pass http://api:8080/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: let React Router handle client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache the hashed build assets; index.html itself stays uncached
    # so deploys are picked up immediately.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
